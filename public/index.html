<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anomsg Tasks</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <!-- ทุก view ซ่อนไว้จนกว่า /api/me จะตอบ ไม่งั้นคนที่ล็อกอินอยู่แล้วจะเห็นปุ่ม login
       ค้างอยู่ตลอดช่วงที่รอ request แล้วเผลอกดจนถูกพาไปหน้า OAuth ซ้ำโดยไม่จำเป็น -->
  <p id="loading">กำลังตรวจสอบการเข้าสู่ระบบ…</p>

  <!-- อยู่นอก #app เพราะ error ที่เกิดตอนเรียก /api/me ครั้งแรกต้องแสดงได้
       ทั้งที่ยังไม่รู้ว่าจะเข้า view ไหน -->
  <p id="error" role="alert" hidden></p>

  <section id="login" hidden>
    <h1>Anomsg Tasks</h1>
    <p>เข้าสู่ระบบด้วย Discord เพื่อจัดการงานของเซิร์ฟเวอร์</p>
    <button id="login-btn">Login with Discord</button>
  </section>

  <!-- เปิดหน้านี้ตรงๆ โดยไม่มี ?guild= และไม่มี session (เช่น บุ๊กมาร์กหน้าแรกไว้) -->
  <section id="explain" hidden>
    <h1>Anomsg Tasks</h1>
    <p>หน้านี้ต้องเข้าผ่านคำสั่ง <code>/web</code> ในเซิร์ฟเวอร์ Discord ที่ต้องการจัดการ task เท่านั้น
      พิมพ์ <code>/web</code> ในเซิร์ฟเวอร์นั้นแล้วกดลิงก์ที่บอทตอบกลับมา</p>
    <button id="explain-logout-btn">ออกจากระบบ</button>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Anomsg Tasks</h1>
      <span id="who"></span>
      <button id="logout-btn">ออก</button>
    </header>

    <nav>
      <button data-filter="all" aria-pressed="true">ทั้งหมด</button>
      <button data-filter="mine" aria-pressed="false">ของฉัน</button>
      <button data-filter="done" aria-pressed="false">เสร็จแล้ว</button>
    </nav>

    <form id="add-form">
      <input id="add-name" placeholder="ชื่องานใหม่" maxlength="200" required>
      <button type="submit">เพิ่ม</button>
    </form>

    <ul id="list"></ul>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
